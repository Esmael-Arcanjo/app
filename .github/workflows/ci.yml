name: ci
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mongo: { image: "mongo:7", ports: ["27017:27017"] }
    env:
      MONGO_URL: mongodb://localhost:27017
      DB_NAME: ci
      JWT_SECRET: ci-secret-not-for-production-0123456789
      DATA_ENCRYPTION_KEY: ${{ secrets.CI_FERNET_KEY }}
      CORS_ORIGINS: http://localhost:3000
      PUBLIC_APP_URL: http://localhost:3000
      STRIPE_SECRET_KEY: sk_test_dummy
      STRIPE_WEBHOOK_SECRET: whsec_dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r backend/requirements.txt pip-audit --extra-index-url https://d33sy5i8bnduwe.cloudfront.net/simple/
      - run: cd backend && pytest -q
      - run: pip-audit -r backend/requirements.txt || true
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: cd frontend && yarn install --frozen-lockfile && npx tsc --noEmit && yarn build
      - run: cd frontend && yarn audit --level high || true
